; death-counter configuration

[display]
; Which corner of the screen the death counter is shown in.
; Valid values: top_left, top_right, bottom_left, bottom_right
corner = top_right

; Size of the death counter.
; 1.0 is the reference size: 18px text height on a 1080p screen.
; The counter scales proportionally with your resolution, and this
; value is applied on top of that (e.g. 2.0 = twice as large).
; Valid range: 0.25 to 5.0
scale = 1.0
