name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: MSVC (x64, windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          mkdir staging
          Copy-Item build/Release/death_counter.dll staging/
          Copy-Item death_counter.ini staging/
          Copy-Item fonts/OFL.txt staging/
          Compress-Archive -Path staging/* -DestinationPath death_counter-0.1.0-msvc-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: death_counter-0.1.0-msvc-x64
          path: death_counter-0.1.0-msvc-x64.zip
